# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - nadra

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm install, generate Prisma client, and build
        env:
          DATABASE_URL: file:./ci.db
          AUTH_SECRET: ci-build-placeholder-secret-at-least-32-chars
        run: |
          npm install
          npm run build

      - name: Assemble standalone Azure package
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r prisma .next/standalone/prisma
          mv .next/standalone/server.js .next/standalone/next-server.js
          cp server.js .next/standalone/server.js
          cp package.json .next/standalone/package.json
          rm -f .next/standalone/.env .next/standalone/.env.*
          rm -rf .next/standalone/storage

          mkdir -p .next/standalone/node_modules/@prisma
          for pkg in better-sqlite3 bindings file-uri-to-path prebuild-install; do
            if [ -d "node_modules/$pkg" ]; then
              cp -r "node_modules/$pkg" .next/standalone/node_modules/
            fi
          done
          for pkg in adapter-better-sqlite3 client; do
            if [ -d "node_modules/@prisma/$pkg" ]; then
              cp -r "node_modules/@prisma/$pkg" .next/standalone/node_modules/@prisma/
            fi
          done

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          path: .next/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nadra'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E2EA49260394490CB564D53534BE43B1 }}
